<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Súper Online</title>

    <link rel="icon" href="imagenes/carrito.jpg">

    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    
    <link rel="stylesheet" href="tp final - super online - grupo 1.CSS">

</head>

<body>

    <header class="bg-success text-white text-center p-4">

        <h1>Mi Súper Online</h1>

   </header>

   

    <main class="container mt-4">

        <section class="formulario shadow">

            <h2 class="mb-4">Agregar producto</h2>

            <input
                type="text"
                id="nombre"
                class="form-control mb-3"
                placeholder="Nombre del producto">

            <input
                type="number"
                id="precio"
                class="form-control mb-3"
                placeholder="Precio">

        
            <button
                id="btnAgregar"
                class="btn btn-success"
                onclick="agregarProducto()">

                Agregar producto

            </button>

            <p id="mensaje" class="mt-3"></p>

        </section>

        <!-- PRODUCTOS -->

        <section class="mt-5">

            <h2 class="mb-4">Productos cargados</h2>

            <div
                id="contenedorProductos"
                class="row">

            </div>

        </section>

    </main>

    <!-- LUPA -->

    <div id="lupaCard"></div>

    <!-- BOOTSTRAP JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="tp final - super online - grupo 1.js"></script>
<footer class="bg-dark text-white text-center p-4 mt-5">

    <p class="mb-1">
        Mi Súper Online © Curso CILSA JavaScript 2026
    </p>

    <p class="mb-0">
        Desarrollado por Grupo 1 - Bazed Carolina - Garcia Retamar Gabriela
    </p>

</footer>

</body>

</html>
